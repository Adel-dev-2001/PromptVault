services:
  promptvault:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: promptvault_app
    restart: unless-stopped
    ports:
      - "127.0.0.1:5000:5000"
    environment:
      - APP_ENV=production
      - SECRET_KEY=${SECRET_KEY:?set SECRET_KEY}
      - FLASK_DEBUG=0
      - DATABASE_PATH=/app/data/prompts.db
      - UPLOAD_FOLDER=/app/data/uploads
      - TRUST_PROXY=${TRUST_PROXY:-0}
      - APP_PASSWORD=${APP_PASSWORD:-}
    volumes:
      - promptvault_data:/app/data
      - promptvault_uploads:/app/data/uploads

volumes:
  promptvault_data:
    driver: local
  promptvault_uploads:
    driver: local
