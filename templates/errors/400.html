{% extends "layout.html" %}

{% block title %}PromptVault{% endblock %}

{% block content %}
<div class="form-page">
    <div class="form-card error-card">
        <div class="form-header">
            <div class="form-icon error-icon"><i class="fas fa-exclamation-triangle" aria-hidden="true"></i></div>
            <h2>400 - Bad Request</h2>
            <p>The request could not be processed due to invalid syntax, missing CSRF token, or malformed data.</p>
        </div>
        <div class="error-actions">
            <a href="/" class="btn btn-primary"><i class="fas fa-arrow-left"></i> Return to Gallery</a>
        </div>
    </div>
</div>
{% endblock %}
