name: CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  lint:
    name: Ruff Lint and Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'
          cache-dependency-path: requirements-dev.txt

      - name: Install dev tools
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run ruff checks
        run: |
          ruff check .
          ruff format --check .

      - name: Audit runtime dependencies
        run: pip-audit -r requirements.txt

  test:
    name: Automated Unit Tests
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.11', '3.12', '3.13']

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute automated unit tests
        run: |
          python -m unittest -v test_app.py

  docker:
    name: Docker Build and Runtime Smoke Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Build container image
        run: docker build -t promptvault:ci .

      - name: Run container and curl /
        run: |
          SECRET_KEY="$(python3 -c 'import secrets; print(secrets.token_hex(32))')"
          docker run -d --name promptvault-ci \
            -p 127.0.0.1:5000:5000 \
            -e SECRET_KEY="$SECRET_KEY" \
            promptvault:ci
          trap 'docker logs promptvault-ci || true; docker rm -f promptvault-ci || true' EXIT
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:5000/ | grep -q "PromptVault"; then
              echo "Container responded on attempt $i"
              exit 0
            fi
            sleep 1
          done
          echo "Container failed to respond on http://127.0.0.1:5000/"
          exit 1
