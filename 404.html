<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PromptVault</title>
    <meta name="robots" content="noindex">
    <link rel="stylesheet" href="https://adel-dev-2001.github.io/PromptVault/static/styles.css">
    <link rel="stylesheet" href="./static/styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer">
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=DM+Sans:ital,wght@0,300;0,400;0,500;0,700;1,300&display=swap" rel="stylesheet">
    <link rel="icon" type="image/svg+xml" href="https://adel-dev-2001.github.io/PromptVault/static/favicon.svg">
</head>
<body>
    <header role="banner">
        <a href="https://adel-dev-2001.github.io/PromptVault/" class="logo" aria-label="PromptVault Home">
            <span class="logo-icon" aria-hidden="true"><i class="fas fa-vault"></i></span>
            PromptVault
        </a>
        <nav aria-label="Main Navigation">
            <a href="https://adel-dev-2001.github.io/PromptVault/" class="btn btn-primary">
                <i class="fas fa-th-large" aria-hidden="true"></i> Open Gallery
            </a>
        </nav>
    </header>

    <main id="main-content" role="main">
        <div class="form-page">
            <div class="form-card error-card">
                <div class="form-header">
                    <div class="form-icon error-icon"><i class="fas fa-ghost" aria-hidden="true"></i></div>
                    <h2>404 - Page Not Found</h2>
                    <p>The prompt, image, or page you are looking for does not exist or may have been moved.</p>
                </div>
                <div class="error-actions">
                    <a href="https://adel-dev-2001.github.io/PromptVault/" class="btn btn-primary">
                        <i class="fas fa-arrow-left" aria-hidden="true"></i> Return to Gallery
                    </a>
                </div>
            </div>
        </div>
    </main>

    <footer role="contentinfo">
        <div class="footer-content">
            <p>&copy; 2026 PromptVault | CS50x Final Project</p>
            <p class="footer-subtitle">by Adel Mohamed</p>
        </div>
    </footer>
</body>
</html>
